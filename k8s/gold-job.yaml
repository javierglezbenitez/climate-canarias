# Capa gold: calcula anomalías, tendencias y rejillas por década a partir del cubo Zarr de
# silver y las guarda en Parquet en el bucket gold.
# Se lanza a mano:  kubectl apply -f k8s/gold-job.yaml
# Para repetirlo hay que borrar el Job antes:  kubectl -n climate delete job gold-indicators
apiVersion: batch/v1
kind: Job
metadata:
  name: gold-indicators
  namespace: climate
  labels:
    app.kubernetes.io/name: gold
    app.kubernetes.io/part-of: climate-canarias
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gold
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gold
          image: climate-pipeline:0.2.0
          imagePullPolicy: IfNotPresent   # la imagen se carga en kind con `kind load docker-image`
          command: ["python", "gold_indicators.py"]
          env:
            - name: S3_ENDPOINT
              value: "http://minio.climate.svc.cluster.local:9000"
            - name: S3_BUCKET_SILVER
              value: "silver"
            - name: S3_BUCKET_GOLD
              value: "gold"
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
