# Capa silver: valida (Java) y unifica (Python) los NetCDF de bronze en un cubo Zarr.
# Se lanza a mano:  kubectl apply -f k8s/silver-job.yaml
# Para repetirlo hay que borrar el Job antes:  kubectl -n climate delete job silver-transform
apiVersion: batch/v1
kind: Job
metadata:
  name: silver-transform
  namespace: climate
  labels:
    app.kubernetes.io/name: silver
    app.kubernetes.io/part-of: climate-canarias
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silver
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: silver
          image: climate-pipeline:0.3.0
          imagePullPolicy: IfNotPresent   # la imagen se carga en kind con `kind load docker-image`
          command: ["python", "silver_transform.py"]
          env:
            - name: S3_ENDPOINT
              value: "http://minio.climate.svc.cluster.local:9000"
            - name: S3_BUCKET_BRONZE
              value: "bronze"
            - name: S3_BUCKET_SILVER
              value: "silver"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m"
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
